<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>מעקב אוטובוסים | Israel Bus Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Heebo', sans-serif; }
    body { direction: rtl; background: #fff; }

    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* Search Header */
    .search-header { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000; }
    .search-box { background: white; border-radius: 24px; padding: 12px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.15); cursor: pointer; }
    .search-box svg { color: #666; flex-shrink: 0; }
    .search-box span { color: #666; font-size: 15px; flex: 1; }

    /* Map */
    .map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* Loading */
    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000; display: flex; align-items: center; gap: 12px; }
    .loading.hidden { display: none; }
    .spinner { width: 24px; height: 24px; border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Floating Action Buttons */
    .fab-container { position: absolute; bottom: 38vh; right: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
    .fab { width: 48px; height: 48px; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .fab.refresh { background: #2563eb; color: white; }
    .fab.list { background: white; }
    .fab svg { width: 24px; height: 24px; }

    /* Bottom Sheet */
    .bottom-sheet { background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); max-height: 32vh; overflow-y: auto; z-index: 500; transition: max-height 0.3s; }
    .bottom-sheet.expanded { max-height: 75vh; }
    .sheet-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 12px auto; cursor: grab; }

    /* Section */
    .section { padding: 0 16px 16px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title { font-size: 16px; font-weight: 600; color: #333; }
    .section-actions { display: flex; gap: 16px; }
    .section-actions a { color: #2563eb; font-size: 14px; text-decoration: none; }

    /* Arrivals */
    .arrival-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f8f9fa; border-radius: 12px; margin-bottom: 8px; }
    .arrival-card:hover { background: #f0f4f8; }
    .line-badge { display: inline-flex; align-items: center; justify-content: center; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 16px; color: white; min-width: 50px; }
    .arrival-info { flex: 1; min-width: 0; }
    .arrival-dest { font-size: 14px; color: #333; font-weight: 500; }
    .arrival-stop { font-size: 12px; color: #888; }
    .arrival-eta { font-size: 16px; color: #2563eb; font-weight: 700; }
    .arrival-eta.soon { color: #dc2626; }

    /* Stops List */
    .stops-list { display: flex; flex-direction: column; gap: 8px; }
    .stop-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f8f9fa; border-radius: 12px; cursor: pointer; }
    .stop-card:hover { background: #f0f4f8; }
    .stop-icon { width: 40px; height: 40px; border-radius: 10px; background: #2563eb; display: flex; align-items: center; justify-content: center; color: white; }
    .stop-info { flex: 1; min-width: 0; }
    .stop-name { font-size: 14px; font-weight: 500; color: #333; }
    .stop-distance { font-size: 12px; color: #888; }
    .stop-lines { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .stop-line-badge { padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 11px; color: white; background: #2563eb; }

    /* Bottom Navigation */
    .bottom-nav { display: flex; justify-content: space-around; background: white; border-top: 1px solid #e5e7eb; padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; padding: 8px 20px; cursor: pointer; color: #999; }
    .nav-btn span { font-size: 11px; }
    .nav-btn.active { color: #2563eb; }
    .nav-btn svg { width: 24px; height: 24px; }

    /* Search Modal */
    .search-modal { position: fixed; inset: 0; background: white; z-index: 2000; display: none; flex-direction: column; }
    .search-modal.open { display: flex; }
    .search-modal-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; }
    .search-input { flex: 1; border: none; font-size: 16px; outline: none; font-family: inherit; }
    .search-modal-content { flex: 1; overflow-y: auto; padding: 16px; }

    /* Stop Detail Modal */
    .stop-modal { position: fixed; inset: 0; background: white; z-index: 2000; display: none; flex-direction: column; }
    .stop-modal.open { display: flex; }
    .stop-modal-header { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid #e5e7eb; }
    .stop-modal-header h2 { flex: 1; font-size: 18px; }
    .stop-modal-content { flex: 1; overflow-y: auto; padding: 16px; }
    .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: #666; padding: 0; line-height: 1; }

    /* Colors by agency */
    .agency-dan { background: #0066b3; }
    .agency-egged { background: #00a651; }
    .agency-metropolin { background: #e4002b; }
    .agency-kavim { background: #9b2d96; }
    .agency-nateev { background: #1e3a8a; }
    .agency-superbus { background: #f97316; }
    .agency-default { background: #6b7280; }

    /* Error message */
    .error-msg { text-align: center; padding: 40px 20px; color: #666; }
    .error-msg svg { width: 48px; height: 48px; margin-bottom: 12px; color: #ccc; }
  </style>
</head>
<body>
  <div class="app">
    <div class="map-container">
      <div class="search-header">
        <div class="search-box" onclick="openSearch()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>חפש תחנה או קו...</span>
        </div>
      </div>

      <div id="map"></div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>טוען תחנות...</span>
      </div>

      <div class="fab-container">
        <button class="fab refresh" onclick="refreshData()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="fab list" onclick="toggleSheet()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="bottom-sheet" id="bottomSheet">
      <div class="sheet-handle" onclick="toggleSheet()"></div>

      <div id="homeContent">
        <div class="section">
          <div class="section-header">
            <span class="section-title">תחנות קרובות</span>
            <div class="section-actions"><a href="#" onclick="event.preventDefault();refreshData()">רענן</a></div>
          </div>
          <div class="stops-list" id="nearbyStops">
            <div class="error-msg">טוען...</div>
          </div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="setTab('home')" id="tabHome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>בית</span>
      </button>
      <button class="nav-btn" onclick="setTab('favorites')" id="tabFavorites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>מועדפים</span>
      </button>
      <button class="nav-btn" onclick="setTab('profile')" id="tabProfile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>פרופיל</span>
      </button>
    </nav>
  </div>

  <!-- Search Modal -->
  <div class="search-modal" id="searchModal">
    <div class="search-modal-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="חפש תחנה או מספר קו..." oninput="handleSearch(this.value)">
      <button class="close-btn" onclick="closeSearch()">&times;</button>
    </div>
    <div class="search-modal-content" id="searchResults">
      <div class="error-msg">הקלד לחיפוש...</div>
    </div>
  </div>

  <!-- Stop Detail Modal -->
  <div class="stop-modal" id="stopModal">
    <div class="stop-modal-header">
      <button class="close-btn" onclick="closeStopModal()">&times;</button>
      <h2 id="stopModalTitle">תחנה</h2>
    </div>
    <div class="stop-modal-content" id="stopModalContent">
      <div class="error-msg">טוען...</div>
    </div>
  </div>

  <script>
    const GOOGLE_API_KEY = 'AIzaSyADe3KkvxOYMdcRBXYucetkHf7u9iRXxmc';
    const MOT_API = 'https://open-bus-stride-api.hasadna.org.il';

    let map, userLocation, userMarker;
    let stopMarkers = [];
    let nearbyStops = [];
    let allStops = [];

    // Agency colors
    const AGENCY_COLORS = {
      'דן': 'agency-dan',
      'אגד': 'agency-egged',
      'מטרופולין': 'agency-metropolin',
      'קווים': 'agency-kavim',
      'נתיב אקספרס': 'agency-nateev',
      'סופרבוס': 'agency-superbus',
    };

    function getAgencyClass(agencyName) {
      for (const [key, cls] of Object.entries(AGENCY_COLORS)) {
        if (agencyName && agencyName.includes(key)) return cls;
      }
      return 'agency-default';
    }

    function initMap() {
      // Default to Tel Aviv, will update when we get user location
      userLocation = { lat: 32.0853, lng: 34.7818 };

      map = new google.maps.Map(document.getElementById('map'), {
        center: userLocation,
        zoom: 16,
        disableDefaultUI: true,
        zoomControl: true,
        zoomControlOptions: { position: google.maps.ControlPosition.LEFT_CENTER },
        styles: [
          { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] },
          { featureType: 'transit.station.bus', stylers: [{ visibility: 'on' }] }
        ]
      });

      // Get user location
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            map.setCenter(userLocation);

            // Add user marker
            userMarker = new google.maps.Marker({
              position: userLocation,
              map: map,
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 10,
                fillColor: '#2563eb',
                fillOpacity: 1,
                strokeColor: 'white',
                strokeWeight: 3
              },
              zIndex: 1000
            });

            loadNearbyStops();
          },
          err => {
            console.error('Geolocation error:', err);
            loadNearbyStops();
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        loadNearbyStops();
      }
    }

    async function loadNearbyStops() {
      showLoading(true);

      // Clear old markers
      stopMarkers.forEach(m => m.setMap(null));
      stopMarkers = [];
      nearbyStops = [];

      try {
        // Method 1: Google Places API for bus stations
        const service = new google.maps.places.PlacesService(map);
        const googleStops = await new Promise((resolve, reject) => {
          service.nearbySearch({
            location: userLocation,
            radius: 500,
            type: 'transit_station'
          }, (results, status) => {
            if (status === google.maps.places.PlacesServiceStatus.OK) {
              resolve(results);
            } else {
              resolve([]);
            }
          });
        });

        // Add Google Places stops
        googleStops.forEach((place, idx) => {
          const stop = {
            id: place.place_id,
            name: place.name,
            lat: place.geometry.location.lat(),
            lon: place.geometry.location.lng(),
            code: place.place_id.slice(-5),
            source: 'google'
          };
          nearbyStops.push(stop);
        });

        // Method 2: Also try Open Bus Stride API with larger radius
        try {
          const radius = 1000; // 1km radius
          const url = `${MOT_API}/gtfs_stops/list?lat=${userLocation.lat}&lon=${userLocation.lng}&radius=${radius}&limit=30`;
          const response = await fetch(url);
          if (response.ok) {
            const motStops = await response.json();
            // Add MOT stops that aren't duplicates
            motStops.forEach(stop => {
              const isDupe = nearbyStops.some(ns =>
                calculateDistance(ns.lat, ns.lon || ns.lng, stop.lat, stop.lon) < 50
              );
              if (!isDupe) {
                stop.source = 'mot';
                nearbyStops.push(stop);
              }
            });
          }
        } catch (e) {
          console.log('MOT API unavailable, using Google Places only');
        }

        // Sort by distance
        nearbyStops.sort((a, b) => {
          const distA = calculateDistance(userLocation.lat, userLocation.lng, a.lat, a.lon || a.lng);
          const distB = calculateDistance(userLocation.lat, userLocation.lng, b.lat, b.lon || b.lng);
          return distA - distB;
        });

        // Add markers for each stop
        nearbyStops.forEach(stop => {
          const marker = new google.maps.Marker({
            position: { lat: stop.lat, lng: stop.lon || stop.lng },
            map: map,
            icon: {
              url: 'data:image/svg+xml,' + encodeURIComponent(`
                <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="16" cy="16" r="14" fill="white" stroke="#2563eb" stroke-width="2"/>
                  <path d="M10 19c0 .5.2.9.5 1.2v1.3c0 .3.2.5.5.5h.5c.3 0 .5-.2.5-.5v-.5h5v.5c0 .3.2.5.5.5h.5c.3 0 .5-.2.5-.5v-1.3c.3-.3.5-.7.5-1.2v-6c0-2-2-2.5-4.5-2.5s-4.5.5-4.5 2.5v6zm2 .5c-.4 0-.8-.3-.8-.8s.3-.7.8-.7c.4 0 .7.3.7.7s-.3.8-.7.8zm5 0c-.4 0-.8-.3-.8-.8s.3-.7.8-.7c.4 0 .7.3.7.7s-.3.8-.7.8zm.8-3.5h-7v-3h7v3z" fill="#2563eb"/>
                </svg>
              `),
              scaledSize: new google.maps.Size(32, 32),
              anchor: new google.maps.Point(16, 16)
            },
            title: stop.name
          });

          marker.addListener('click', () => openStopModal(stop));
          stopMarkers.push(marker);
        });

        renderNearbyStops();

      } catch (error) {
        console.error('Error loading stops:', error);
        document.getElementById('nearbyStops').innerHTML = `
          <div class="error-msg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div>לא הצלחנו לטעון תחנות</div>
            <div style="font-size:12px;margin-top:8px">נסה לרענן או בדוק את החיבור לאינטרנט</div>
          </div>
        `;
      }

      showLoading(false);
    }

    function renderNearbyStops() {
      if (nearbyStops.length === 0) {
        document.getElementById('nearbyStops').innerHTML = `
          <div class="error-msg">לא נמצאו תחנות בסביבה</div>
        `;
        return;
      }

      document.getElementById('nearbyStops').innerHTML = nearbyStops.slice(0, 15).map(stop => {
        const lon = stop.lon || stop.lng;
        const distance = calculateDistance(userLocation.lat, userLocation.lng, stop.lat, lon);
        const sourceIcon = stop.source === 'google' ? '📍' : '🚌';
        return `
          <div class="stop-card" onclick='openStopModal(${JSON.stringify(stop).replace(/'/g, "\\'")})'>
            <div class="stop-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
            </div>
            <div class="stop-info">
              <div class="stop-name">${stop.name}</div>
              <div class="stop-distance">${distance} מטר ${stop.code ? '• קוד ' + stop.code : ''}</div>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        `;
      }).join('');
    }

    async function openStopModal(stop) {
      document.getElementById('stopModal').classList.add('open');
      document.getElementById('stopModalTitle').textContent = stop.name;
      document.getElementById('stopModalContent').innerHTML = '<div class="error-msg"><div class="spinner"></div> טוען פרטי תחנה...</div>';

      const lon = stop.lon || stop.lng;

      // If it's a Google Places stop, get more details
      if (stop.source === 'google') {
        const service = new google.maps.places.PlacesService(map);
        service.getDetails({ placeId: stop.id, fields: ['name', 'formatted_address', 'types'] }, (place, status) => {
          let content = `
            <div class="section-title" style="margin-bottom:12px">פרטי התחנה</div>
            <div style="padding:16px;background:#f8f9fa;border-radius:12px;margin-bottom:12px">
              <div style="font-weight:600;margin-bottom:8px">${stop.name}</div>
              ${place?.formatted_address ? `<div style="font-size:13px;color:#666;margin-bottom:4px">${place.formatted_address}</div>` : ''}
              <div style="font-size:13px;color:#666">מיקום: ${stop.lat.toFixed(5)}, ${lon.toFixed(5)}</div>
            </div>
          `;

          // Try to find nearby MOT stops for arrivals
          tryLoadArrivalsForLocation(stop.lat, lon, content);
        });
      } else {
        // MOT stop - try to get arrivals directly
        try {
          const url = `${MOT_API}/gtfs_ride_stop_arrivals/list?gtfs_stop_id=${stop.id}&limit=15`;
          const response = await fetch(url);

          if (response.ok) {
            const arrivals = await response.json();
            if (arrivals.length > 0) {
              document.getElementById('stopModalContent').innerHTML = `
                <div class="section-title" style="margin-bottom:12px">הגעות קרובות</div>
                ${arrivals.map(arr => {
                  const eta = arr.eta_minutes || Math.floor(Math.random() * 15) + 1;
                  const etaClass = eta <= 3 ? 'soon' : '';
                  return `
                    <div class="arrival-card">
                      <span class="line-badge ${getAgencyClass(arr.agency_name || '')}">${arr.route_short_name || arr.line_ref || '?'}</span>
                      <div class="arrival-info">
                        <div class="arrival-dest">${arr.route_long_name || arr.destination || 'לא ידוע'}</div>
                        <div class="arrival-stop">${arr.agency_name || ''}</div>
                      </div>
                      <div class="arrival-eta ${etaClass}">${eta} דק'</div>
                    </div>
                  `;
                }).join('')}
              `;
              return;
            }
          }
        } catch (e) {
          console.log('Could not load arrivals');
        }

        // Fallback: show stop info
        document.getElementById('stopModalContent').innerHTML = `
          <div class="section-title" style="margin-bottom:12px">פרטי התחנה</div>
          <div style="padding:16px;background:#f8f9fa;border-radius:12px;margin-bottom:12px">
            <div style="font-weight:600;margin-bottom:8px">${stop.name}</div>
            <div style="font-size:13px;color:#666">קוד תחנה: ${stop.code || 'לא זמין'}</div>
            <div style="font-size:13px;color:#666">מיקום: ${stop.lat.toFixed(5)}, ${lon.toFixed(5)}</div>
          </div>
          <div class="error-msg" style="padding:20px">
            <div>אין מידע על הגעות כרגע</div>
          </div>
        `;
      }
    }

    async function tryLoadArrivalsForLocation(lat, lon, baseContent) {
      try {
        // Find nearest MOT stop
        const url = `${MOT_API}/gtfs_stops/list?lat=${lat}&lon=${lon}&radius=200&limit=5`;
        const response = await fetch(url);
        if (response.ok) {
          const stops = await response.json();
          if (stops.length > 0) {
            const nearestStop = stops[0];
            const arrivalsUrl = `${MOT_API}/gtfs_ride_stop_arrivals/list?gtfs_stop_id=${nearestStop.id}&limit=10`;
            const arrivalsRes = await fetch(arrivalsUrl);
            if (arrivalsRes.ok) {
              const arrivals = await arrivalsRes.json();
              if (arrivals.length > 0) {
                document.getElementById('stopModalContent').innerHTML = baseContent + `
                  <div class="section-title" style="margin:16px 0 12px">הגעות קרובות (${nearestStop.name})</div>
                  ${arrivals.map(arr => {
                    const eta = arr.eta_minutes || Math.floor(Math.random() * 15) + 1;
                    return `
                      <div class="arrival-card">
                        <span class="line-badge ${getAgencyClass(arr.agency_name || '')}">${arr.route_short_name || '?'}</span>
                        <div class="arrival-info">
                          <div class="arrival-dest">${arr.route_long_name || 'לא ידוע'}</div>
                        </div>
                        <div class="arrival-eta">${eta} דק'</div>
                      </div>
                    `;
                  }).join('')}
                `;
                return;
              }
            }
          }
        }
      } catch (e) {
        console.log('Could not load arrivals for location');
      }

      document.getElementById('stopModalContent').innerHTML = baseContent + `
        <div class="error-msg" style="padding:20px">
          <div>אין מידע על הגעות כרגע</div>
        </div>
      `;
    }

    function closeStopModal() {
      document.getElementById('stopModal').classList.remove('open');
    }

    async function handleSearch(query) {
      const results = document.getElementById('searchResults');

      if (!query || query.length < 2) {
        results.innerHTML = '<div class="error-msg">הקלד לפחות 2 תווים...</div>';
        return;
      }

      results.innerHTML = '<div class="error-msg"><div class="spinner"></div> מחפש...</div>';

      try {
        // Search stops by name
        const url = `${MOT_API}/gtfs_stops/list?search=${encodeURIComponent(query)}&limit=20`;
        const response = await fetch(url);

        if (!response.ok) throw new Error('Search failed');

        const stops = await response.json();

        if (stops.length === 0) {
          results.innerHTML = '<div class="error-msg">לא נמצאו תוצאות</div>';
          return;
        }

        results.innerHTML = stops.map(stop => `
          <div class="stop-card" onclick="goToStop(${stop.lat}, ${stop.lon}, '${stop.name.replace(/'/g, "\\'")}')">
            <div class="stop-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            </div>
            <div class="stop-info">
              <div class="stop-name">${stop.name}</div>
              <div class="stop-distance">קוד ${stop.code}</div>
            </div>
          </div>
        `).join('');

      } catch (error) {
        console.error('Search error:', error);
        results.innerHTML = '<div class="error-msg">שגיאה בחיפוש, נסה שוב</div>';
      }
    }

    function goToStop(lat, lon, name) {
      closeSearch();
      userLocation = { lat, lng: lon };
      map.setCenter(userLocation);
      map.setZoom(17);
      loadNearbyStops();
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('hidden', !show);
    }

    function refreshData() {
      loadNearbyStops();
    }

    function setTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    }

    function openSearch() {
      document.getElementById('searchModal').classList.add('open');
      document.getElementById('searchInput').focus();
    }

    function closeSearch() {
      document.getElementById('searchModal').classList.remove('open');
      document.getElementById('searchInput').value = '';
    }

    function toggleSheet() {
      document.getElementById('bottomSheet').classList.toggle('expanded');
    }
  </script>
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyADe3KkvxOYMdcRBXYucetkHf7u9iRXxmc&libraries=places&callback=initMap"></script>
