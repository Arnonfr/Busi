<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>מעקב אוטובוסים | Israel Bus Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; direction: rtl; background: #f5f5f5; }

    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    .header { background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; flex-shrink: 0; }
    .header h1 { font-size: 1.1rem; font-weight: 600; }
    .location-btn { background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; transition: background 0.2s; }
    .location-btn:hover { background: rgba(255,255,255,0.3); }

    .main-content { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; min-height: 0; }

    #map { flex: 1; min-height: 200px; z-index: 1; background: #e5e3df; }

    .bus-count-badge { position: absolute; top: 12px; left: 12px; background: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; color: #2c5282; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 500; }

    .bottom-panel { background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); max-height: 40vh; overflow-y: auto; z-index: 500; flex-shrink: 0; }

    .favorites-section { padding: 16px; border-bottom: 1px solid #e2e8f0; }
    .favorites-section h2 { font-size: 14px; color: #4a5568; margin-bottom: 12px; }
    .favorites-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .favorites-scroll::-webkit-scrollbar { height: 4px; }
    .favorites-scroll::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 2px; }
    .favorite-card { display: flex; align-items: center; gap: 10px; background: #f7fafc; padding: 10px 14px; border-radius: 12px; cursor: pointer; min-width: fit-content; border: 2px solid transparent; transition: all 0.2s; }
    .favorite-card:hover { background: #edf2f7; }

    .line-badge { min-width: 48px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: white; font-weight: bold; font-size: 14px; padding: 0 8px; }
    .favorite-info { display: flex; flex-direction: column; gap: 2px; }
    .favorite-info .operator { font-size: 12px; color: #718096; }
    .favorite-info .distance { font-size: 11px; color: #a0aec0; }
    .favorite-card .eta { font-size: 13px; font-weight: 600; color: #2c5282; margin-right: auto; white-space: nowrap; }

    .bus-list { padding: 16px; }
    .buses-scroll { display: flex; flex-direction: column; gap: 8px; max-height: 30vh; overflow-y: auto; }
    .buses-scroll::-webkit-scrollbar { width: 4px; }
    .buses-scroll::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 2px; }

    .bus-card { background: #f7fafc; border-radius: 12px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
    .bus-card:hover { background: #edf2f7; }
    .bus-card.selected { border-color: #4299e1; background: #ebf8ff; }
    .bus-card-main { display: flex; align-items: center; gap: 12px; padding: 12px; }
    .bus-line-badge { min-width: 56px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; padding: 0 10px; }
    .bus-details { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .bus-operator { font-size: 14px; font-weight: 500; color: #2d3748; }
    .bus-distance { font-size: 12px; color: #718096; }
    .bus-eta-container { text-align: left; min-width: 80px; }
    .bus-eta { font-size: 14px; font-weight: 600; color: #2c5282; }
    .bus-eta.arriving { color: #38a169; animation: etaPulse 1.5s ease-in-out infinite; }
    @keyframes etaPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .favorite-btn { background: none; border: none; padding: 8px; cursor: pointer; color: #cbd5e0; border-radius: 50%; transition: all 0.2s; }
    .favorite-btn:hover { background: rgba(0,0,0,0.05); color: #fbbf24; }
    .favorite-btn.active { color: #fbbf24; }

    .bottom-nav { display: flex; justify-content: space-around; background: white; border-top: 1px solid #e2e8f0; padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); flex-shrink: 0; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; padding: 8px 16px; cursor: pointer; color: #718096; transition: color 0.2s; }
    .nav-btn span { font-size: 11px; }
    .nav-btn.active { color: #2c5282; }

    .loading-state, .empty-state { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 20px; color: #718096; text-align: center; }
    .loading-spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #4299e1; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search-bar { display: flex; align-items: center; gap: 10px; background: #f7fafc; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; }
    .search-bar input { flex: 1; border: none; background: transparent; font-size: 14px; outline: none; direction: rtl; }
    .search-bar input::placeholder { color: #a0aec0; }

    /* Leaflet custom styles */
    .leaflet-container { font-family: inherit; }
    .bus-marker { background: transparent !important; border: none !important; }
    .bus-marker-inner { display: flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); white-space: nowrap; }
    .bus-marker-inner span { color: white; font-weight: bold; font-size: 12px; }

    .user-marker { background: transparent !important; border: none !important; }
    .user-dot { width: 16px; height: 16px; background: #4299e1; border: 3px solid white; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .user-pulse { position: absolute; width: 40px; height: 40px; background: rgba(66,153,225,0.3); border-radius: 50%; top: -12px; left: -12px; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>מעקב אוטובוסים | Israel Bus Tracker</h1>
      <button class="location-btn" onclick="centerOnUser()" title="מיקום נוכחי">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
      </button>
    </header>

    <div class="main-content">
      <div id="map"></div>
      <div class="bus-count-badge" id="busCount">טוען...</div>

      <div class="bottom-panel">
        <div class="favorites-section" id="favoritesSection" style="display:none">
          <h2>קווים מועדפים</h2>
          <div class="favorites-scroll" id="favoritesList"></div>
        </div>

        <div class="bus-list">
          <div class="search-bar" id="searchBar" style="display:none">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#718096" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="חפש קו או מפעיל..." oninput="filterBuses()">
          </div>
          <div id="busList"><div class="loading-state"><div class="loading-spinner"></div><span>טוען אוטובוסים...</span></div></div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="setTab('home')" id="tabHome">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>בית</span>
      </button>
      <button class="nav-btn" onclick="setTab('favorites')" id="tabFavorites">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <span>מועדפים</span>
      </button>
      <button class="nav-btn" onclick="setTab('search')" id="tabSearch">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>חיפוש</span>
      </button>
      <button class="nav-btn" onclick="setTab('alerts')" id="tabAlerts">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <span>התראות</span>
      </button>
    </nav>
  </div>

  <script>
    // Bus operators in Israel
    const OPERATORS = {
      'egged': { name: 'אגד', color: '#00a651' },
      'dan': { name: 'דן', color: '#0066b3' },
      'metropolin': { name: 'מטרופולין', color: '#e4002b' },
      'kavim': { name: 'קווים', color: '#9b2d96' },
      'superbus': { name: 'סופרבוס', color: '#ff6600' },
      'nateev': { name: 'נתיב אקספרס', color: '#1e3a8a' },
      'afikim': { name: 'אפיקים', color: '#d97706' },
    };

    // State
    let map, userMarker;
    let userLocation = { lat: 32.0853, lng: 34.7818 }; // Default: Tel Aviv
    let buses = [];
    let markers = {};
    let favorites = JSON.parse(localStorage.getItem('favoriteBuses') || '[]');
    let activeTab = 'home';
    let selectedBusId = null;

    // Initialize map
    function initMap() {
      map = L.map('map', {
        center: [userLocation.lat, userLocation.lng],
        zoom: 15,
        zoomControl: true
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      }).addTo(map);

      // Add user marker
      updateUserMarker();

      // Get user location
      getUserLocation();
    }

    function getUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            map.setView([userLocation.lat, userLocation.lng], 15);
            updateUserMarker();
            loadBuses();
          },
          err => {
            console.log('Location error, using default:', err);
            loadBuses();
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        loadBuses();
      }
    }

    function updateUserMarker() {
      if (userMarker) map.removeLayer(userMarker);

      const icon = L.divIcon({
        className: 'user-marker',
        html: '<div class="user-pulse"></div><div class="user-dot"></div>',
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      userMarker = L.marker([userLocation.lat, userLocation.lng], { icon, zIndexOffset: 1000 }).addTo(map);
    }

    function centerOnUser() {
      getUserLocation();
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function formatDistance(km) {
      return km < 1 ? `${Math.round(km * 1000)} מטר` : `${km.toFixed(1)} ק"מ`;
    }

    function formatEta(km) {
      const minutes = Math.round((km / 20) * 60); // Assume 20 km/h average
      if (minutes <= 1) return 'מגיע עכשיו';
      if (minutes < 60) return `${minutes} דק'`;
      return `${Math.floor(minutes/60)} שעות`;
    }

    // Generate realistic demo bus data around user location
    function loadBuses() {
      const busLines = [
        { line: '5', op: 'dan', dest: 'רכבת ההגנה' },
        { line: '25', op: 'dan', dest: 'בני ברק' },
        { line: '51', op: 'dan', dest: 'פתח תקווה' },
        { line: '82', op: 'dan', dest: 'בת ים' },
        { line: '142', op: 'metropolin', dest: 'ראשון לציון' },
        { line: '240', op: 'metropolin', dest: 'רחובות' },
        { line: '301', op: 'metropolin', dest: 'אשדוד' },
        { line: '480', op: 'egged', dest: 'ירושלים' },
        { line: '405', op: 'egged', dest: 'ירושלים' },
        { line: '947', op: 'nateev', dest: 'באר שבע' },
        { line: '89', op: 'kavim', dest: 'הרצליה' },
        { line: '47', op: 'kavim', dest: 'רמת השרון' },
        { line: '501', op: 'superbus', dest: 'נתניה' },
        { line: '601', op: 'afikim', dest: 'טבריה' },
      ];

      buses = busLines.map((b, i) => {
        // Random position around user (0.2 - 2.5 km)
        const angle = (i / busLines.length) * 2 * Math.PI + Math.random() * 0.5;
        const dist = 0.2 + Math.random() * 2.3;
        const lat = userLocation.lat + (dist / 111) * Math.cos(angle);
        const lng = userLocation.lng + (dist / (111 * Math.cos(userLocation.lat * Math.PI / 180))) * Math.sin(angle);

        const actualDist = calculateDistance(userLocation.lat, userLocation.lng, lat, lng);
        const op = OPERATORS[b.op];

        return {
          id: `bus-${i}`,
          lineNumber: b.line,
          destination: b.dest,
          operator: op.name,
          operatorId: b.op,
          operatorColor: op.color,
          lat, lng,
          distance: actualDist,
          distanceText: formatDistance(actualDist),
          etaText: formatEta(actualDist),
          etaMinutes: Math.round((actualDist / 20) * 60)
        };
      }).sort((a, b) => a.distance - b.distance);

      updateUI();
      updateMarkers();
    }

    function updateMarkers() {
      // Remove old markers
      Object.keys(markers).forEach(id => {
        if (!buses.find(b => b.id === id)) {
          map.removeLayer(markers[id]);
          delete markers[id];
        }
      });

      // Add/update bus markers
      buses.forEach(bus => {
        const icon = L.divIcon({
          className: 'bus-marker',
          html: `<div class="bus-marker-inner" style="background:${bus.operatorColor}"><span>${bus.lineNumber}</span></div>`,
          iconSize: [40, 24],
          iconAnchor: [20, 12]
        });

        if (markers[bus.id]) {
          markers[bus.id].setLatLng([bus.lat, bus.lng]).setIcon(icon);
        } else {
          const marker = L.marker([bus.lat, bus.lng], { icon })
            .addTo(map)
            .on('click', () => selectBus(bus.id))
            .bindPopup(`
              <div style="direction:rtl;text-align:right;min-width:150px">
                <div style="font-size:18px;font-weight:bold;color:${bus.operatorColor}">קו ${bus.lineNumber}</div>
                <div style="color:#666;margin:4px 0">${bus.operator}</div>
                <div style="color:#444">ל${bus.destination}</div>
                <div style="margin-top:8px;display:flex;justify-content:space-between">
                  <span style="color:#718096">${bus.distanceText}</span>
                  <strong style="color:#2c5282">${bus.etaText}</strong>
                </div>
              </div>
            `);
          markers[bus.id] = marker;
        }
      });
    }

    function updateUI() {
      document.getElementById('busCount').textContent = `${buses.length} אוטובוסים`;
      updateBusList();
      updateFavorites();
    }

    function updateBusList() {
      const search = document.getElementById('searchInput')?.value?.toLowerCase() || '';
      let list = [...buses];

      if (activeTab === 'favorites') {
        list = favorites.map(f => {
          const live = buses.find(b => b.lineNumber === f.lineNumber && b.operatorId === f.operatorId);
          return live || { ...f, distanceText: '-', etaText: 'אין מידע', id: `fav-${f.lineNumber}-${f.operatorId}` };
        });
      } else if (activeTab === 'search' && search) {
        list = buses.filter(b =>
          b.lineNumber.toLowerCase().includes(search) ||
          b.operator.includes(search) ||
          b.destination.includes(search)
        );
      } else if (activeTab === 'home') {
        list = buses.filter(b => b.distance < 2.5).slice(0, 10);
      }

      const container = document.getElementById('busList');

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" width="48" height="48"><path fill="#cbd5e0" d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
            <span>${activeTab === 'favorites' ? 'אין קווים מועדפים' : 'לא נמצאו אוטובוסים'}</span>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="buses-scroll">
          ${list.map(bus => `
            <div class="bus-card ${selectedBusId === bus.id ? 'selected' : ''}" onclick="selectBus('${bus.id}')">
              <div class="bus-card-main">
                <div class="bus-line-badge" style="background:${bus.operatorColor}">${bus.lineNumber}</div>
                <div class="bus-details">
                  <span class="bus-operator">${bus.operator} → ${bus.destination || ''}</span>
                  <span class="bus-distance">${bus.distanceText || '-'}</span>
                </div>
                <div class="bus-eta-container">
                  <span class="bus-eta ${bus.etaMinutes <= 2 ? 'arriving' : ''}">${bus.etaText || '-'}</span>
                </div>
                <button class="favorite-btn ${isFavorite(bus) ? 'active' : ''}" onclick="event.stopPropagation();toggleFavorite('${bus.lineNumber}','${bus.operatorId}','${bus.operator}','${bus.operatorColor}')">
                  <svg viewBox="0 0 24 24" width="20" height="20">
                    ${isFavorite(bus)
                      ? '<path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>'
                      : '<path fill="currentColor" d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/>'}
                  </svg>
                </button>
              </div>
            </div>
          `).join('')}
        </div>`;
    }

    function updateFavorites() {
      const section = document.getElementById('favoritesSection');
      const list = document.getElementById('favoritesList');

      if (activeTab === 'home' && favorites.length > 0) {
        section.style.display = 'block';
        list.innerHTML = favorites.map(f => {
          const live = buses.find(b => b.lineNumber === f.lineNumber && b.operatorId === f.operatorId);
          const data = live || f;
          return `
            <div class="favorite-card" onclick="selectBus('${live?.id || ''}')">
              <div class="line-badge" style="background:${data.operatorColor}">${data.lineNumber}</div>
              <div class="favorite-info">
                <span class="operator">${data.operator}</span>
                <span class="distance">${data.distanceText || '-'}</span>
              </div>
              <div class="eta">${data.etaText || '-'}</div>
            </div>`;
        }).join('');
      } else {
        section.style.display = 'none';
      }
    }

    function selectBus(id) {
      selectedBusId = id;
      const bus = buses.find(b => b.id === id);
      if (bus) {
        map.setView([bus.lat, bus.lng], 16);
        if (markers[id]) markers[id].openPopup();
      }
      updateBusList();
    }

    function toggleFavorite(lineNumber, operatorId, operator, color) {
      const idx = favorites.findIndex(f => f.lineNumber === lineNumber && f.operatorId === operatorId);
      if (idx >= 0) {
        favorites.splice(idx, 1);
      } else {
        favorites.push({ lineNumber, operatorId, operator, operatorColor: color });
      }
      localStorage.setItem('favoriteBuses', JSON.stringify(favorites));
      updateUI();
    }

    function isFavorite(bus) {
      return favorites.some(f => f.lineNumber === bus.lineNumber && f.operatorId === bus.operatorId);
    }

    function setTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
      document.getElementById('searchBar').style.display = tab === 'search' ? 'flex' : 'none';
      selectedBusId = null;
      updateUI();
    }

    function filterBuses() {
      updateBusList();
    }

    // Simulate bus movement
    function moveBuses() {
      buses.forEach(bus => {
        // Move slightly toward user
        const dx = userLocation.lat - bus.lat;
        const dy = userLocation.lng - bus.lng;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 0.001) {
          bus.lat += (dx / dist) * 0.0002 * (0.5 + Math.random());
          bus.lng += (dy / dist) * 0.0002 * (0.5 + Math.random());
          bus.distance = calculateDistance(userLocation.lat, userLocation.lng, bus.lat, bus.lng);
          bus.distanceText = formatDistance(bus.distance);
          bus.etaText = formatEta(bus.distance);
          bus.etaMinutes = Math.round((bus.distance / 20) * 60);
        }
      });
      buses.sort((a, b) => a.distance - b.distance);
      updateMarkers();
      updateUI();
    }

    // Start
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      // Update buses every 5 seconds
      setInterval(moveBuses, 5000);
    });
  </script>
</body>
</html>
